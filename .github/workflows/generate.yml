name: Generate image (SD-Turbo, CPU)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate.yml"
      - "generate.py"
      - "prompt.txt"
  workflow_dispatch:
    inputs:
      prompt:
        description: "Image prompt"
        required: false
        default: "a cozy bakery storefront at sunrise, warm light, photorealistic"
      steps:
        description: "Inference steps (1-4)"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: image-gen
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Runner specs
        run: |
          nproc
          free -h
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sd-turbo-v1

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate safetensors Pillow

      - name: Generate image
        run: |
          if [ -n "${{ inputs.prompt }}" ]; then
            python3 generate.py --prompt "${{ inputs.prompt }}" --steps "${{ inputs.steps || '4' }}"
          else
            python3 generate.py --steps "${{ inputs.steps || '4' }}"
          fi

      - name: Commit result
        run: |
          git config user.name "img-gen-bot"
          git config user.email "img-gen-bot@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Generated image [skip ci]"
          git push
