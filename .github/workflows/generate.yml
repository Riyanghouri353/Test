name: Generate image (SD, CPU)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate.yml"
      - "generate.py"
      - "prompt.txt"
  workflow_dispatch:
    inputs:
      prompt:
        description: "Image prompt"
        required: false
        default: "a cozy bakery storefront at sunrise, warm light, photorealistic"
      steps:
        description: "Inference steps (4 for Turbo, 25 for standard models)"
        required: false
        default: "25"

permissions:
  contents: write

concurrency:
  group: image-gen
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Runner specs
        run: |
          nproc
          free -h
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fresh cache key per model family, no restore-keys: XL weights
      # are ~6.5 GB and the 14 GB runner disk cannot hold two model
      # families plus torch. Each family switch re-downloads once.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v3

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate safetensors Pillow

      - name: Generate image
        run: |
          set -o pipefail
          if [ -n "${{ inputs.prompt }}" ]; then
            python3 generate.py --prompt "${{ inputs.prompt }}" --steps "${{ inputs.steps || '25' }}" 2>&1 | tee generate.log
          else
            python3 generate.py 2>&1 | tee generate.log
          fi

      - name: Commit result
        if: always()
        run: |
          git config user.name "img-gen-bot"
          git config user.email "img-gen-bot@users.noreply.github.com"
          git add generate.log
          [ -d output ] && git add output/ || true
          git diff --cached --quiet || git commit -m "Generated image [skip ci]"
          git push
